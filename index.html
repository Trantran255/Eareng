<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Để bắt đầu, nhấn phím Tab một lần. Sau đó dùng phím mũi tên để di chuyển và nhấn Enter để chọn.</title>
  <link rel="stylesheet" href="css/style.css?v=6">
  <script>
    /* Nếu web bị lỗi, hiện thẳng dòng báo lỗi lên màn hình để biết lỗi ở đâu. */
    function baoLoi(chu) {
      var o = document.createElement("p");
      o.setAttribute("role", "alert");
      o.style.cssText = "background:#fff;color:#b00000;border:4px solid #b00000;padding:14px;font-size:20px;";
      o.textContent = "LỖI: " + chu;
      (document.body || document.documentElement).appendChild(o);
    }
    window.addEventListener("error", function (e) {
      var t = e.target;
      if (t && t.tagName === "SCRIPT") {
        baoLoi("không tải được file " + t.getAttribute("src"));
      } else if (e.message) {
        baoLoi(e.message + " (" + String(e.filename).split("/").pop() + ", dòng " + e.lineno + ")");
      }
    }, true);
  </script>
</head>
<body class="tuong-phan-cao">
  <!-- Trang không chứa bất kỳ chữ ẩn nào. Mọi chữ có trong trang đều đang hiện trên màn hình. -->

  <!-- Câu mở đầu. Trình đọc màn hình đọc câu này qua tên trang (thẻ title),
       nên ở đây đánh dấu aria-hidden để không bị đọc hai lần. -->
  <div id="phan-tinh">
    <p aria-hidden="true"><strong>Để bắt đầu, nhấn phím Tab một lần.</strong>
    Sau đó dùng phím mũi tên để di chuyển và nhấn Enter để chọn.</p>
    <span id="diem-bat-dau" tabindex="0"></span>
  </div>

  <div id="man-hinh" role="application"></div>

  <p id="thong-bao" aria-live="polite"></p>

  <script src="data/tuvung.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
  <script>
    /* Bắt thẳng phím Tab: nhấn Tab ở màn đầu là web bắt đầu,
       kể cả khi trình duyệt không tự đưa con trỏ vào trang. */
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Tab") return;
      if (typeof batDauWeb !== "function" || daBatDau) return;
      e.preventDefault();
      batDauWeb();
    }, true);

    if (typeof batDauWeb !== "function") {
      baoLoi("file js/app.js chưa chạy được.");
    } else if (typeof CAC_BO_TU === "undefined") {
      baoLoi("file data/tuvung.js chưa chạy được.");
    }
  </script>
</body>
</html>
